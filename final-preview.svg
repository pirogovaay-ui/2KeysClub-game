  </defs>
  <rect width="390" height="844" fill="#202426"/>
  <rect width="390" height="844" fill="#353a3d" opacity=".82"/>
  <rect width="390" height="844" fill="url(#grid)"/>

  <image href="assets/thumbs-up.png" x="139" y="184" width="112" height="112" preserveAspectRatio="xMidYMid meet"/>

  <text x="195" y="330" text-anchor="middle"
