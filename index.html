<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>2 Keys Run</title>
    <link rel="preload" href="assets/2keys_club_logo_transparent.png" as="image">
    <link rel="preload" href="assets/thumbs-up.png" as="image">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" width="390" height="844" aria-label="2 Keys Run game"></canvas>

      <button id="startButton" class="start-button" type="button">START</button>

      <section class="controls" aria-label="Controls">
        <button class="control-button" type="button" data-control="left" aria-label="Left">&larr;</button>
        <button class="control-button" type="button" data-control="right" aria-label="Right">&rarr;</button>
        <button class="control-button jump" type="button" data-control="jump" aria-label="Jump">JUMP</button>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
